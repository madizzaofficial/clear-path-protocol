        - generic [ref=e84]:
          - heading "Explained" [level=2] [ref=e85]
          - generic [ref=e87]:
            - paragraph [ref=e88]: Glycerin (or glycerol) is a compound naturally found in your skin. It's a powerhouse humectant that pulls water into the stratum corneum.
            - paragraph [ref=e89]: "Topically, glycerin does several things at once:"
            - list [ref=e90]:
              - listitem [ref=e91]: It bings water via hydrogen bonding to boost stratum corneum hydration and reduce transepidermal water loss (TEWL).
              - listitem [ref=e92]: It enhances lipid cohesion in the skin barrier and helps lipids stay in a functional state at low humidity.
              - listitem [ref=e93]:
                - text: It accelerates barrier recovery after irritation; one study showed measurable repair of
                - link "SLS" [ref=e94] [cursor=pointer]:
                  - /url: https://skinsort.com/ingredients/sodium-lauryl-sulfate
                - text: "-damaged skin even at low doses."
            - paragraph [ref=e95]: Your skin makes glycerin on its own (mostly from sebaceous oil breakdown) and shuttles it to your outermost layer of skin, or your epidermis, via aquaporin-3.
            - paragraph [ref=e96]: Aquaporin-3 is a transporter that is essential for normal skin hydration, elasticity, and repair. Interestingly, mice lacking in AQP3 have dry and less elastic skin that can be fully corrected with glycerin.
            - paragraph [ref=e97]: This ingredient is non-irritating, plays well with almost every ingredient, and works across all skin types. Typical use is anywhere between 3-10% but can go up to 79% in some leave-on products.
            - paragraph [ref=e98]: Just know very high concentrations (>40%) can feel tacky in low humidity.
            - paragraph [ref=e99]: Glycerin is the name for this ingredient in American English. British English uses Glycerol/Glycerine.
          - paragraph [ref=e100]:
